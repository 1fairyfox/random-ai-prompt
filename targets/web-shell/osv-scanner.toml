# osv-scanner ignore config for the Tauri v2 desktop shell (next to Cargo.lock).
#
# Read by osv-scanner and by the OpenSSF Scorecard "Vulnerabilities" check (which explicitly
# supports an osv-scanner.toml next to the dependency manifest — see
# https://github.com/ossf/scorecard/blob/main/docs/checks.md#vulnerabilities).
#
# Every entry is an "unmaintained crate" / "unsound" advisory with NO patched version to move
# to. They are pulled TRANSITIVELY by Tauri v2 → WebKitGTK on Linux (the gtk3-rs binding set was
# marked unmaintained 2024-08, but WebKitGTK still requires GTK3), plus a few unmaintained macro
# / unicode helper crates. Confirmed with `cargo audit` (all "Warning: unmaintained/unsound",
# zero fixable vulnerabilities). Re-evaluate on every Tauri/dep bump: if Tauri's Linux WebView
# drops GTK3 or an upstream fix appears, delete the matching entry.

